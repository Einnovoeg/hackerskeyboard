plugins {
    id 'com.android.application'
}

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.pocketworkstation.pckeyboard'
        minSdk 27
        targetSdk 37
        versionCode 3000002
        versionName '3.0.2'

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}

// The incremental resource merger can keep a values.xml that is missing the
// resources contributed by libraries when the project lives on a filesystem with
// coarse timestamps (observed on an external volume: every resource edit produced
// "color/black not found" until a forced re-merge). Re-running the merge is a few
// seconds and keeps builds deterministic; correctness matters more than that here.
tasks.withType(com.android.build.gradle.tasks.MergeResources).configureEach {
    outputs.upToDateWhen { false }
}
